spring:
  # 로컬 개발용 docker-compose 자동 기동은 테스트에서 끈다
  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:p6spy:h2:mem:testdb;MODE=MYSQL;DB_CLOSE_DELAY=-1
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace

# JWT 서명 키 — 테스트 전용 값. HS256 이라 32바이트(256bit) 이상이어야 한다(짧으면 WeakKeyException 으로
# 기동 실패 — JwtSupport fail-fast, auth-design.md §14-2). 운영 키와 무관한 공개 가능 문자열이다.
ytcreator:
  auth:
    jwt:
      secret: test-only-hs256-secret-0123456789abcdef!

  payment:
    # 상품 코드는 코드 상수가 아니라 설정이다 — 테스트 전용 값이며 운영 sku 와 무관하다.
    one-time:
      sku: test.one-time
    subscription:
      sku: test.subscription
    toss:
      # 테스트에서 mTLS 를 조립하지 않는다 — 토스 호출은 목으로 막는다.
      enabled: false

  subtitle:
    queue:
      # 테스트는 Redis 를 띄우지 않는다 — 큐 어댑터는 대역(목)으로 채우고 Redis 구현체는 단위 테스트가 직접 만든다.
      enabled: false
      work-stream: test:subtitle:work
      done-stream: test:subtitle:done
      group: test-server
      consumer: test-1

management:
  health:
    redis:
      enabled: false
