spring:
  # 로컬 개발용 docker-compose 자동 기동은 테스트에서 끈다
  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:p6spy:h2:mem:testdb;MODE=MYSQL;DB_CLOSE_DELAY=-1
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace

# JWT 서명 키 — 테스트 전용 값. HS256 이라 32바이트(256bit) 이상이어야 한다(짧으면 WeakKeyException 으로
# 기동 실패 — JwtSupport fail-fast, auth-design.md §14-2). 운영 키와 무관한 공개 가능 문자열이다.
ytcreator:
  auth:
    jwt:
      secret: test-only-hs256-secret-0123456789abcdef!
