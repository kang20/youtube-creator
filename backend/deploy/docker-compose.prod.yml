# 앱 VM(ytcreator-app) 운영용 compose — 블루-그린 무중단 배포.
# 두 색(app-blue/app-green) 중 평시엔 한 색만 실행하고, 배포 때만 새 색을 띄워 전환한다.
# 활성 색은 caddy/upstream.caddy 스니펫이 단일 진실 — deploy.sh / rollback.sh 가 관리한다.
# .env(IMAGE_TAG 포함)는 배포 워크플로가 GitHub 시크릿/변수에서 매번 생성한다.
# MySQL 은 별도 VM(ytcreator-db, 프라이빗 서브넷)에서 돌며 DB_HOST 로 접근한다.
# 로그 로테이션: 모든 서비스에 앵커 필수(신규 서비스 포함) — docs/ops/logging.md §5.1
x-logging: &app-logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }
x-logging-small: &small-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

# 블루-그린 공통 앱 정의 — 색만 다르고 나머지는 동일(YAML 앵커로 중복 제거).
x-app-base: &app-base
  image: ghcr.io/kang20/ytcreator-backend:${IMAGE_TAG:-latest}
  restart: unless-stopped
  logging: *app-logging
  # 두 색이 겹치는 배포 구간(≈1분) 대비 4g×2 + caddy 0.5g + alloy 0.25g < 12GB.
  # JVM 힙은 MaxRAMPercentage=75(≈3g)로 이 한도를 추종.
  mem_limit: 4g
  # Spring graceful shutdown(≤25s, application-prod.yml)보다 길게 — 드레인 중 SIGKILL 방지.
  stop_grace_period: 35s
  environment:
    # 운영 프로파일 — fail-fast datasource / validate / format_sql off 는 application-prod.yml 담당
    SPRING_PROFILES_ACTIVE: prod
    DB_URL: jdbc:mysql://${DB_HOST}:3306/ytcreator?serverTimezone=UTC&characterEncoding=UTF-8
    DB_USERNAME: ytcreator
    DB_PASSWORD: ${DB_PASSWORD}
    # 스키마는 첫 배포(update)로 생성 완료 — 이후 validate 고정, 마이그레이션 시에만 GitHub 변수로 일시 변경
    JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
    # 이미지 업로드 (OCI Object Storage S3 호환 자격증명)
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    # 운영 알림 (신고 접수 → 디스코드). 빈 값이면 앱이 알림만 생략(기동은 정상)
    DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    # admin 콘솔 마스터 개인키 — 빈 값이면 마스터 로그인만 비활성(fail-safe, 기동은 정상)
    ADMIN_MASTER_KEY: ${ADMIN_MASTER_KEY:-}

services:
  # 두 색 모두 profile 지정 — 색 없는 `docker compose up -d` 로는 절대 뜨지 않는다(오조작 방지).
  # 스크립트가 `--profile <색>` 으로 명시 기동한다. 포트는 루프백 전용(헬스체크·전환 판단용).
  # 이름 접미사 = 커밋 sha 앞 7자리(SHORT_SHA, 워크플로 .env + deploy.sh 주입)
  # → `docker ps` 만으로 어떤 커밋이 서빙 중인지 보인다. Caddy 업스트림은 서비스명
  #   네트워크 별칭(app-blue/app-green)을 쓰므로 컨테이너 이름 변경과 무관하다.
  app-blue:
    <<: *app-base
    container_name: ytcreator-app-blue-${SHORT_SHA:-latest}
    profiles: [blue]
    ports:
      - "127.0.0.1:8081:8080"   # 루프백 전용 — deploy/rollback 스크립트 헬스체크
  app-green:
    <<: *app-base
    container_name: ytcreator-app-green-${SHORT_SHA:-latest}
    profiles: [green]
    ports:
      - "127.0.0.1:8082:8080"   # 루프백 전용 — deploy/rollback 스크립트 헬스체크

  # HTTPS 종단 — Let's Encrypt 자동 발급/갱신. 활성 색으로만 프록시(import upstream.caddy).
  # 추가로 127.0.0.1:8080 루프백 사이트로 활성 색 /actuator 를 노출 → 모니터링 터널(18080)이
  # 색 교체와 무관하게 항상 "현재 서빙 중인 색"을 스크레이프한다(Pi 터널·prometheus 무변경).
  caddy:
    image: caddy:2
    container_name: ytcreator-caddy
    restart: unless-stopped
    logging: *small-logging
    mem_limit: 512m
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"   # 모니터링 전용 안정 포트 — 활성 색 metrics 프록시(외부 비노출)
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      # 디렉토리 마운트 — scp 로 파일이 교체(inode 변경)돼도 컨테이너가 새 내용을 본다
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    # depends_on 없음 — 색은 profile 이라 여기서 강제 기동하면 안 된다(스크립트가 관리).

  # 로그 수집 — 이 VM 의 도커 컨테이너 stdout/stderr → Pi Loki push
  alloy:
    # latest 금지, arm64 지원 멀티아치 이미지 버전 고정 (2026-06 v1.17.1)
    image: grafana/alloy:v1.17.1
    container_name: ytcreator-alloy
    restart: unless-stopped
    logging: *small-logging
    mem_limit: 256m
    # SSH 역터널이 Loki(3100)를 "호스트 루프백"에만 바인딩(GatewayPorts no)
    # → 컨테이너가 127.0.0.1:3100 을 보려면 host 네트워크 필수
    network_mode: host
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      # host 네트워크라 Alloy 자체 HTTP UI(:12345)가 호스트에 그대로 노출됨 → 루프백 한정
      - --server.http.listen-addr=127.0.0.1:12345
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # 도커 API 로 컨테이너 발견 + 로그 스트리밍
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # positions 파일(읽기 오프셋) 영속화 — 재시작 후 이어서 읽기
      - alloy-data:/var/lib/alloy/data

  # 호스트 메트릭 (CPU·메모리·디스크) — Pi 터널 -L 19100 이 수집 (docs/ops/monitoring.md §5.1)
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: ytcreator-node-exporter
    restart: unless-stopped
    logging: *small-logging
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100   # 루프백만 — 터널로만 접근
    volumes:
      - /:/host:ro,rslave

volumes:
  caddy-data:
  caddy-config:
  alloy-data:
